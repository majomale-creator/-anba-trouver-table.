<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173f5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ANBA · Trouver la table</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#17202a;background:#f4f1e8}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:720px;margin:auto;padding:18px 16px 40px}
h1{text-align:center;font-size:26px;margin:8px 0 2px}.sub{text-align:center;color:#6b6254;margin:0 0 18px}
.card{background:#fff;border-radius:20px;padding:16px;box-shadow:0 3px 18px #0001;margin-bottom:14px}
button{border:0;border-radius:16px;font-weight:700;font-size:18px;padding:16px;width:100%}
#mic{background:#173f5f;color:#fff;font-size:22px;min-height:70px}#mic.on{background:#8b1e1e}
#status,#heard{text-align:center;color:#665;margin-top:10px}input{width:100%;font-size:22px;padding:15px;border:1px solid #d7d0c4;border-radius:14px}
.cands{display:grid;gap:9px;margin-top:12px}.cand{background:#eee8db;color:#222;text-align:left;padding:13px}
.result{display:none;text-align:center}.name{font-size:26px;font-weight:750}.table{font-size:82px;font-weight:850;line-height:1;margin:8px 0 18px}
.small{text-align:center;color:#746d62;font-size:13px}
</style></head>
<body><div class="wrap">
<h1>À nos belles Années</h1><p class="sub">Accueil · trouver la table</p>
<div class="card"><button id="mic">🎤 DIRE LE NOM</button><div id="status">Appuyez puis prononcez le nom.</div><div id="heard"></div></div>
<div class="card"><input id="q" placeholder="Ou taper quelques lettres…" autocomplete="off" autocorrect="off"><div id="cands" class="cands"></div></div>
<div id="result" class="card result"><div>INVITÉ</div><div id="rname" class="name"></div><div style="margin-top:18px">TABLE</div><div id="rtable" class="table"></div><button id="again">NOUVELLE RECHERCHE</button></div>
<div class="small">136 invités · données test intégrées. La recherche par texte est locale. Le micro dépend de la reconnaissance vocale disponible dans Safari/iOS.</div>
</div>
<script src="app.js"></script></body></html>
